<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - គ្រប់គ្រងការចុះឈ្មោះ</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600&display=swap');
    body {
      font-family: 'Kantumruy Pro', sans-serif; background: #f4f7f6;
      display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
    }
    .admin-panel {
      background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center; width: 100%; max-width: 400px;
    }
    h2 { color: #185a9d; margin-bottom: 20px; }
    .status-badge {
      display: inline-block; padding: 10px 20px; border-radius: 50px; font-weight: bold; font-size: 18px; margin-bottom: 30px;
    }
    .status-open { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
    .status-closed { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
    button {
      width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px;
      font-size: 16px; font-weight: bold; cursor: pointer; font-family: 'Kantumruy Pro', sans-serif; transition: 0.3s;
    }
    .btn-open { background-color: #28a745; color: white; }
    .btn-open:hover { background-color: #218838; }
    .btn-close { background-color: #dc3545; color: white; }
    .btn-close:hover { background-color: #c82333; }
  </style>
</head>
<body>

  <div class="admin-panel">
    <h2>ផ្ទាំងគ្រប់គ្រង (Admin Panel)</h2>
    <div>ស្ថានភាពប្រព័ន្ធបច្ចុប្បន្ន៖</div>
    <div id="currentStatus" class="status-badge status-closed">កំពុងពិនិត្យ...</div>

    <button class="btn-open" onclick="changeStatus('OPEN')">🟢 បើកឲ្យចុះឈ្មោះ (OPEN)</button>
    <button class="btn-close" onclick="changeStatus('CLOSED')">🔴 បិទការចុះឈ្មោះ (CLOSE)</button>
  </div>

  <script>
    // បញ្ចូល URL Apps Script របស់អ្នកនៅទីនេះ (URL តែមួយជាមួយទំព័រវត្តមាន)
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxL4i_uIsdavDV_cgDkmqhf6pZ-5TFyTR8tWHMvbmn_TrUo1-TIvg2F81U79kJn3Ww/exec";

    // ឆែកស្ថានភាពបច្ចុប្បន្នពេលបើកទំព័រ
    window.onload = function() {
      fetch(APPS_SCRIPT_URL + "?action=getStatus")
        .then(res => res.json())
        .then(data => updateUI(data.status))
        .catch(err => console.error(err));
    };

    function updateUI(status) {
      const badge = document.getElementById('currentStatus');
      if (status === 'OPEN') {
        badge.className = 'status-badge status-open';
        badge.innerText = 'បើកដំណើរការ (OPEN)';
      } else {
        badge.className = 'status-badge status-closed';
        badge.innerText = 'បានបិទ (CLOSED)';
      }
    }

    function changeStatus(newStatus) {
      Swal.fire({
        title: 'កំពុងដំណើរការ...',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "setStatus", status: newStatus })
      })
      .then(res => res.json())
      .then(result => {
        if (result.success) {
          updateUI(result.status);
          Swal.fire('ជោគជ័យ!', `ប្រព័ន្ធត្រូវបាន ${newStatus === 'OPEN' ? 'បើក' : 'បិទ'} រួចរាល់។`, 'success');
        }
      })
      .catch(err => Swal.fire('បរាជ័យ', 'មានបញ្ហាក្នុងការតភ្ជាប់', 'error'));
    }
  </script>
</body>
</html>
